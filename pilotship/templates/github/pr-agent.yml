# PR-Agent: open-source AI code review as a GitHub Action.
#
# OPTIONAL. Copy to .github/workflows/pr-agent.yml to run PR-Agent alongside
# (or instead of) Greptile. Community-maintained, MIT:
# https://github.com/The-PR-Agent/pr-agent
#
# Before enabling:
#   1. Add the model key as a repository secret (OPENAI_KEY is the documented
#      default; other providers go through LiteLLM, see the PR-Agent docs for
#      the exact variable names, e.g. Anthropic or Gemini keys and
#      `config.model`).
#   2. Verify the action ref and env names against the current README. They
#      moved when the project changed hands in April 2026.
#
# Triggers: PR opened / reopened / marked ready, and any `/review`,
# `/improve`, `/describe`, `/ask` comment on a PR.
name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr-agent:
    # skip bot-authored comments so PR-Agent does not answer itself (or Greptile)
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: PR-Agent
        uses: The-PR-Agent/pr-agent@main   # pin to a tag once verified
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          # Alternative providers (verify names in the PR-Agent docs):
          # ANTHROPIC.KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # config.model: "anthropic/claude-sonnet-5"
          # GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # config.model: "gemini/gemini-3.5-flash"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"   # we write our own PR bodies from the template
          github_action_config.auto_improve: "false"
